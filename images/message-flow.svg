<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" font-family="'SF Pro Text', 'Inter', -apple-system, BlinkMacSystemFont, sans-serif">
  <rect width="900" height="640" fill="#FAFAF9"/>

  <!-- Title -->
  <text x="450" y="40" text-anchor="middle" font-size="22" font-weight="600" fill="#1A1A1A">Message Flow: One Query, Many Turns</text>
  <text x="450" y="62" text-anchor="middle" font-size="13" fill="#6B7280">Following "Find papers about quantum computing" through the system</text>

  <!-- Swim lanes -->
  <g>
    <!-- User lane -->
    <text x="120" y="102" text-anchor="middle" font-size="12" font-weight="600" fill="#2D3748">USER</text>
    <line x1="120" y1="112" x2="120" y2="570" stroke="#2D3748" stroke-width="1" stroke-dasharray="2,3" opacity="0.4"/>

    <!-- Client lane -->
    <text x="360" y="102" text-anchor="middle" font-size="12" font-weight="600" fill="#4C51BF">CLIENT</text>
    <line x1="360" y1="112" x2="360" y2="570" stroke="#4C51BF" stroke-width="1" stroke-dasharray="2,3" opacity="0.4"/>

    <!-- LLM lane -->
    <text x="600" y="102" text-anchor="middle" font-size="12" font-weight="600" fill="#6B46C1">CLAUDE (LLM)</text>
    <line x1="600" y1="112" x2="600" y2="570" stroke="#6B46C1" stroke-width="1" stroke-dasharray="2,3" opacity="0.4"/>

    <!-- Server lane -->
    <text x="800" y="102" text-anchor="middle" font-size="12" font-weight="600" fill="#059669">SERVER</text>
    <line x1="800" y1="112" x2="800" y2="570" stroke="#059669" stroke-width="1" stroke-dasharray="2,3" opacity="0.4"/>
  </g>

  <!-- Step 1: User types query -->
  <g>
    <circle cx="120" cy="140" r="14" fill="#2D3748"/>
    <text x="120" y="145" text-anchor="middle" font-size="12" font-weight="600" fill="white">1</text>
    <line x1="134" y1="140" x2="346" y2="140" stroke="#374151" stroke-width="1.5"/>
    <polygon points="352,140 342,135 342,145" fill="#374151"/>
    <text x="240" y="132" text-anchor="middle" font-size="11" fill="#374151">"Find papers about quantum computing"</text>
  </g>

  <!-- Step 2: Client → LLM -->
  <g>
    <circle cx="360" cy="185" r="14" fill="#4C51BF"/>
    <text x="360" y="190" text-anchor="middle" font-size="12" font-weight="600" fill="white">2</text>
    <line x1="374" y1="185" x2="586" y2="185" stroke="#4C51BF" stroke-width="1.5"/>
    <polygon points="592,185 582,180 582,190" fill="#4C51BF"/>
    <text x="480" y="177" text-anchor="middle" font-size="11" fill="#4C51BF">messages + tools schema</text>
    <text x="480" y="200" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">client.messages.create(...)</text>
  </g>

  <!-- Step 3: LLM decides tool use -->
  <g>
    <circle cx="600" cy="235" r="14" fill="#6B46C1"/>
    <text x="600" y="240" text-anchor="middle" font-size="12" font-weight="600" fill="white">3</text>
    <line x1="586" y1="235" x2="374" y2="235" stroke="#6B46C1" stroke-width="1.5"/>
    <polygon points="368,235 378,230 378,240" fill="#6B46C1"/>
    <text x="480" y="227" text-anchor="middle" font-size="11" fill="#6B46C1">tool_use: search_papers(topic="quantum computing")</text>
  </g>

  <!-- Step 4: Client → Server -->
  <g>
    <circle cx="360" cy="285" r="14" fill="#4C51BF"/>
    <text x="360" y="290" text-anchor="middle" font-size="12" font-weight="600" fill="white">4</text>
    <line x1="374" y1="285" x2="786" y2="285" stroke="#4C51BF" stroke-width="1.5"/>
    <polygon points="792,285 782,280 782,290" fill="#4C51BF"/>
    <text x="580" y="277" text-anchor="middle" font-size="11" fill="#374151">execute_tool("search_papers", {"topic": "quantum computing"})</text>
  </g>

  <!-- Step 5: Server executes & returns -->
  <g>
    <circle cx="800" cy="335" r="14" fill="#059669"/>
    <text x="800" y="340" text-anchor="middle" font-size="12" font-weight="600" fill="white">5</text>
    <line x1="786" y1="335" x2="374" y2="335" stroke="#059669" stroke-width="1.5"/>
    <polygon points="368,335 378,330 378,340" fill="#059669"/>
    <text x="580" y="327" text-anchor="middle" font-size="11" fill="#065F46">"2501.12345, 2412.98765, 2411.11111, ..."</text>
  </g>

  <!-- Step 6: Client → LLM again with tool_result -->
  <g>
    <circle cx="360" cy="385" r="14" fill="#4C51BF"/>
    <text x="360" y="390" text-anchor="middle" font-size="12" font-weight="600" fill="white">6</text>
    <line x1="374" y1="385" x2="586" y2="385" stroke="#4C51BF" stroke-width="1.5"/>
    <polygon points="592,385 582,380 582,390" fill="#4C51BF"/>
    <text x="480" y="377" text-anchor="middle" font-size="11" fill="#4C51BF">messages + tool_result appended</text>
    <text x="480" y="400" text-anchor="middle" font-size="10" fill="#6B7280" font-style="italic">full history sent again — LLM is stateless</text>
  </g>

  <!-- Step 7: LLM final text -->
  <g>
    <circle cx="600" cy="440" r="14" fill="#6B46C1"/>
    <text x="600" y="445" text-anchor="middle" font-size="12" font-weight="600" fill="white">7</text>
    <line x1="586" y1="440" x2="374" y2="440" stroke="#6B46C1" stroke-width="1.5"/>
    <polygon points="368,440 378,435 378,445" fill="#6B46C1"/>
    <text x="480" y="432" text-anchor="middle" font-size="11" fill="#6B46C1">text: "I found 5 papers on quantum computing..."</text>
  </g>

  <!-- Step 8: Client → User -->
  <g>
    <circle cx="360" cy="490" r="14" fill="#4C51BF"/>
    <text x="360" y="495" text-anchor="middle" font-size="12" font-weight="600" fill="white">8</text>
    <line x1="346" y1="490" x2="134" y2="490" stroke="#374151" stroke-width="1.5"/>
    <polygon points="128,490 138,485 138,495" fill="#374151"/>
    <text x="240" y="482" text-anchor="middle" font-size="11" fill="#374151">Prints final answer, loop ends</text>
  </g>

  <!-- Callout: The loop -->
  <g>
    <rect x="80" y="540" width="740" height="80" rx="8" fill="#FFF7ED" stroke="#F59E0B" stroke-width="1"/>
    <text x="100" y="562" font-size="12" font-weight="600" fill="#92400E">Why the loop exists (steps 2→3→4→5→6→7):</text>
    <text x="100" y="582" font-size="11" fill="#78350F">The LLM might request several tools before it can answer. Each round, the client sends the FULL conversation</text>
    <text x="100" y="597" font-size="11" fill="#78350F">history — the LLM is stateless. The loop ends only when a response contains just text (no more tool_use).</text>
    <text x="100" y="613" font-size="10" fill="#B45309" font-style="italic">Try tracing: "Find papers about transformers and tell me about the first one" — that's 2 tool calls, 3 LLM turns.</text>
  </g>
</svg>
